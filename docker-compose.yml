services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: superdemocracy
      POSTGRES_PASSWORD: superdemocracy
      POSTGRES_DB: superdemocracy
    volumes:
      - superdemocracy_pg_data:/var/lib/postgresql/data

volumes:
  superdemocracy_pg_data:
